const firebaseConfig={apiKey:"AIzaSyCaLELrocui0Rx7QYBNmq-MM4iSrnr6mo4",authDomain:"junior-jaya-motor.firebaseapp.com",databaseURL:"https://junior-jaya-motor-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"junior-jaya-motor",storageBucket:"junior-jaya-motor.firebasestorage.app",messagingSenderId:"927225285888",appId:"1:927225285888:web:52e3dd2c36cd27d7d4b7e5",measurementId:"G-F9F6LBXBJP"};
let auth=null,db=null,firebaseReady=false;

function setLoginError(message){const el=document.getElementById('loginError');if(el)el.textContent=message||''}
function setLoginStatus(message,color='#667085'){const el=document.getElementById('loginStatus');if(el){el.textContent=message;el.style.color=color}}
function friendlyAuthError(error){
 const code=error&&error.code||'';
 const messages={
  'auth/invalid-email':'Format email tidak valid.','auth/missing-email':'Masukkan alamat email terlebih dahulu.',
  'auth/missing-password':'Masukkan password terlebih dahulu.','auth/weak-password':'Password terlalu lemah. Gunakan minimal 6 karakter.',
  'auth/email-already-in-use':'Email ini sudah terdaftar. Silakan langsung login.','auth/invalid-credential':'Email atau password tidak sesuai.',
  'auth/user-not-found':'Akun belum terdaftar. Klik Buat akun baru.','auth/wrong-password':'Password tidak sesuai.',
  'auth/operation-not-allowed':'Login Email/Password belum diaktifkan di Firebase Authentication.',
  'auth/network-request-failed':'Koneksi internet atau akses ke layanan Firebase bermasalah.',
  'auth/too-many-requests':'Terlalu banyak percobaan. Coba beberapa saat lagi.',
  'auth/unauthorized-domain':'Domain tempat aplikasi dibuka belum diizinkan di Firebase Authentication.',
  'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'API Key Firebase tidak valid. Periksa konfigurasi Firebase.'
 };
 return messages[code]||((error&&error.message)||'Terjadi kesalahan Firebase. Periksa koneksi dan konfigurasi proyek.');
}
try{
 if(!window.firebase||!firebase.initializeApp)throw new Error('Library Firebase tidak berhasil dimuat. Periksa koneksi internet atau izinkan akses ke www.gstatic.com.');
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();db=firebase.database();firebaseReady=true;
 setLoginStatus('Firebase siap. Silakan buat akun baru atau login.','#087b57');
}catch(initError){console.error('Firebase initialization error:',initError);setLoginStatus('Firebase belum siap: '+initError.message,'#c02d3e');}
const $=id=>document.getElementById(id),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),dateKey=(d=new Date())=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
async function loginUser(){
 setLoginError('');if(!firebaseReady||!auth){setLoginError('Firebase belum berhasil dimuat. Muat ulang halaman dan pastikan internet aktif.');return}
 const e=$('loginEmail').value.trim(),p=$('loginPass').value;if(!e||!p){setLoginError('Isi email dan password terlebih dahulu.');return}
 try{await auth.signInWithEmailAndPassword(e,p)}catch(x){console.error('Login error:',x);setLoginError(friendlyAuthError(x))}
}
async function registerUser(){
 setLoginError('');if(!firebaseReady||!auth){setLoginError('Firebase belum berhasil dimuat. Muat ulang halaman dan pastikan internet aktif.');return}
 const e=$('loginEmail').value.trim(),p=$('loginPass').value;if(!e){setLoginError('Masukkan email yang akan didaftarkan.');return}
 if(!p){setLoginError('Masukkan password yang akan digunakan.');return}if(p.length<6){setLoginError('Password minimal 6 karakter.');return}
 try{const result=await auth.createUserWithEmailAndPassword(e,p);setLoginStatus('Akun berhasil dibuat. Anda sedang masuk ke aplikasi.','#087b57');console.info('Firebase account created:',result.user&&result.user.uid)}
 catch(x){console.error('Register error:',x);setLoginError(friendlyAuthError(x))}
}
async function logoutUser(){if(auth)try{await auth.signOut()}catch(x){toast(friendlyAuthError(x))}}
if(firebaseReady){auth.onAuthStateChanged(u=>{currentUser=u;if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=u.email||'Pengguna';startData()}else{$('app').classList.add('hidden');$('login').classList.remove('hidden')}},error=>{console.error('Auth state error:',error);setLoginError(friendlyAuthError(error))})}
function startData(){
 if(!db){toast('Database Firebase belum tersedia.');return}
 ['items','transactions','cashflows'].forEach(path=>db.ref(path).on('value',s=>{let v=s.val()||{};if(path==='items')items=v;else if(path==='transactions')txs=v;else cash=v;if(!$('app').classList.contains('hidden'))render()},error=>{console.error('Database read error:',path,error);toast('Gagal membaca '+path+': '+friendlyAuthError(error))}));
 $('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});render()
}
const titles={dashboard:'Dashboard Operasional',items:'Master Barang & QR Code',scan:'Scan Barang',stockin:'Stok Masuk / Restock',cashier:'Kasir & Barang Keluar',finance:'Keuangan',history:'Riwayat Transaksi'};

function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('topTitle').textContent=titles[p];render()}
function itemArr(){return Object.entries(items).map(([id,x])=>({...x,id}))}
function txArr(){return Object.entries(txs).map(([id,x])=>({...x,id})).sort((a,b)=>(b.time||0)-(a.time||0))}
function cashArr(){return Object.entries(cash).map(([id,x])=>({...x,id})).sort((a,b)=>(b.time||0)-(a.time||0))}
function lowItems(){return itemArr().filter(x=>Number(x.stock)<=Number(x.min||0))}
function render(){if(!currentUser)return;let c=$('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='items')c.innerHTML=itemsPage();if(page==='scan')c.innerHTML=scanPage();if(page==='stockin')c.innerHTML=stockPage();if(page==='cashier')c.innerHTML=cashPage();if(page==='finance')c.innerHTML=financePage();if(page==='history')c.innerHTML=historyPage()}
function dashboard(){let a=itemArr(),low=lowItems(),today=dateKey(),t=txArr().filter(x=>x.date===today),inCount=t.filter(x=>x.type==='stockin').length,outCount=t.filter(x=>x.type==='sale').length;return `<section class="brand-hero"><img src="https://i.ibb.co.com/YFNXnBqY/JJM-Motorcycle-Racing-Crest.png" alt="Logo Junior Jaya Motor"><div><h2>JUNIOR JAYA MOTOR</h2><p>Sistem manajemen bengkel • Stok • Kasir • Servis • Pembukuan</p><span class="brand-tag">JJM WORKSHOP MANAGEMENT</span></div></section><div class="pagehead"><div><h1>Selamat datang di Junior Jaya Motor</h1><div class="sub">Pantau stok dan aktivitas operasional bengkel hari ini.</div></div><span class="pill">● Sistem aktif</span></div><div class="cards"><div class="stat"><div class="statrow"><span class="statlabel">Total Jenis Barang</span><span class="staticon"><i class="fa-solid fa-box"></i></span></div><div class="statnum">${a.length}</div><div class="statnote">Item terdaftar</div></div><div class="stat"><div class="statrow"><span class="statlabel">Total Unit Stok</span><span class="staticon"><i class="fa-solid fa-cubes"></i></span></div><div class="statnum">${a.reduce((s,x)=>s+Number(x.stock||0),0)}</div><div class="statnote">Unit tersedia di gudang</div></div><div class="stat"><div class="statrow"><span class="statlabel">Transaksi Masuk Hari Ini</span><span class="staticon"><i class="fa-solid fa-arrow-down"></i></span></div><div class="statnum">${inCount}</div><div class="statnote">Dokumen restock</div></div><div class="stat"><div class="statrow"><span class="statlabel">Barang Keluar Hari Ini</span><span class="staticon"><i class="fa-solid fa-arrow-up"></i></span></div><div class="statnum">${outCount}</div><div class="statnote">Nota penjualan</div></div></div><div class="panel"><div class="panelhead"><h3><i class="fa-solid fa-triangle-exclamation dangertext"></i> Peringatan Stok</h3><button class="btn soft" onclick="go('stockin')">Restock sekarang</button></div>${low.length?low.map(x=>`<div class="alert ${Number(x.stock)===0?'red':''}"><span><b>${esc(x.name)}</b> · ${esc(x.code)} — stok ${x.stock} (minimum ${x.min})</span><b>${Number(x.stock)===0?'HABIS':'MENIPIS'}</b></div>`).join(''):'<div class="empty">Semua stok berada di atas batas minimum.</div>'}</div><div class="panel"><div class="panelhead"><h3>Akses Pintas</h3></div><div class="quick"><button onclick="go('scan')"><i class="fa-solid fa-qrcode"></i>Scan QR Barang<small>Baca kode dari kamera</small></button><button onclick="go('stockin')"><i class="fa-solid fa-dolly"></i>Stok Masuk<small>Catat pembelian barang</small></button><button onclick="go('cashier')"><i class="fa-solid fa-cash-register"></i>Kasir / Barang Keluar<small>Buat nota penjualan</small></button></div></div>`}
function itemsPage(){return `<div class="pagehead"><div><h1>Master Barang</h1><div class="sub">Kelola katalog, harga, stok, dan label QR setiap barang.</div></div><button class="btn primary" onclick="itemForm()"><i class="fa fa-plus"></i> Tambah Barang</button></div><div class="panel"><div class="toolbar"><input class="search" style="max-width:340px" placeholder="Cari nama / kode barang..." oninput="filterTable(this.value,'itemTable')"><button class="btn soft" onclick="printAllLabels()">Cetak Semua Label QR</button></div><div class="tablewrap"><table id="itemTable"><thead><tr><th>Kode</th><th>Nama Barang</th><th>Kategori</th><th>Modal</th><th>Harga Jual</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${itemArr().map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${x.stock}</td><td>${stockBadge(x)}</td><td><button class="btn soft" onclick="itemForm('${x.id}')"><i class="fa fa-pen"></i></button> <button class="btn soft" onclick="labelOne('${x.id}')"><i class="fa fa-qrcode"></i></button> <button class="btn danger" onclick="deleteItem('${x.id}')"><i class="fa fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Belum ada barang. Tambahkan barang pertama Anda.</td></tr>'}</tbody></table></div></div>`}
function stockBadge(x){return Number(x.stock)<=0?'<span class="pill out">Habis</span>':Number(x.stock)<=Number(x.min)?'<span class="pill low">Menipis</span>':'<span class="pill">Tersedia</span>'}
function itemForm(id){let x=id?items[id]:{code:'',name:'',category:'Sparepart',cost:0,price:0,stock:0,min:2};showModal(`<h3>${id?'Edit':'Tambah'} Barang</h3><form id="itemForm" class="formgrid"><div class="field"><label>Kode Barang</label><input name="code" value="${esc(x.code)}" placeholder="Otomatis jika kosong"></div><div class="field"><label>Nama Barang *</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>Kategori</label><select name="category">${['Oli','Ban','Sparepart','Aki','Busi','Jasa Servis','Aksesoris','Lainnya'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Harga Beli / Modal</label><input name="cost" type="number" min="0" required value="${x.cost}"></div><div class="field"><label>Harga Jual</label><input name="price" type="number" min="0" required value="${x.price}"></div><div class="field"><label>Jumlah Stok ${id?'(stok saat ini)':'Awal'}</label><input name="stock" type="number" min="0" required value="${x.stock}"></div><div class="field"><label>Batas Minimum Stok</label><input name="min" type="number" min="0" value="${x.min}"></div></form><div class="dialogfoot"><button class="btn soft" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveItem('${id||''}')">Simpan Barang</button></div>`)}
async function saveItem(id){let f=$('itemForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));d.code=d.code.trim()||'JJM-'+Date.now().toString().slice(-7);d.name=d.name.trim();['cost','price','stock','min'].forEach(k=>d[k]=Number(d[k]||0));let dup=itemArr().find(x=>x.code.toLowerCase()===d.code.toLowerCase()&&x.id!==id);if(dup){toast('Kode barang sudah digunakan');return}let key=id||db.ref('items').push().key;await db.ref('items/'+key).set({...d,updatedAt:Date.now()});closeModal();toast('Data barang tersimpan')}
function deleteItem(id){if(!confirm('Hapus barang ini? Riwayat transaksi tidak ikut dihapus.'))return;db.ref('items/'+id).remove().then(()=>toast('Barang dihapus'))}
function labelOne(id){let x=items[id];showModal(`<h3>Label QR Barang</h3><div class="qrbox"><div id="qrTarget"></div><div><b>${esc(x.name)}</b><p>${esc(x.code)}</p><strong>${money(x.price)}</strong></div></div><div class="dialogfoot"><button class="btn soft" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="printQr('${id}')">Cetak Label</button></div>`);new QRCode($('qrTarget'),{text:x.code,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}
function printQr(id){let x=items[id];$('printArea').innerHTML=`<div style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #ddd;width:320px"><div id="printQrCode"></div><div><b>${esc(x.name)}</b><p>${esc(x.code)}</p><b>${money(x.price)}</b></div></div>`;$('printArea').classList.remove('hidden');new QRCode($('printQrCode'),{text:x.code,width:90,height:90});setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},300)}
function printAllLabels(){let a=itemArr();if(!a.length)return toast('Belum ada barang');$('printArea').innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${a.map(x=>`<div style="border:1px solid #ddd;padding:8px;display:flex;align-items:center;gap:7px"><div id="q_${x.id}"></div><div style="font-size:11px"><b>${esc(x.name)}</b><p>${esc(x.code)}</p><b>${money(x.price)}</b></div></div>`).join('')}</div>`;$('printArea').classList.remove('hidden');a.forEach(x=>new QRCode($('q_'+x.id),{text:x.code,width:70,height:70}));setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},500)}
function scanPage(){return `<div class="pagehead"><div><h1>Scan Barang</h1><div class="sub">Gunakan kamera atau scanner barcode/QR fisik.</div></div></div><div class="twocol"><div class="panel"><div class="panelhead"><h3>Kamera perangkat</h3><span class="pill">QR Scanner</span></div><div id="reader" style="width:100%;max-width:440px;margin:auto"></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="startScanner()">Mulai Kamera</button><button class="btn soft" onclick="stopScanner()">Matikan Kamera</button></div><p class="sub">Kamera memerlukan HTTPS atau localhost dan izin akses kamera.</p></div><div class="panel"><h3>Input kode manual / scanner USB</h3><div class="field"><label>Kode Barang</label><input id="scanCode" placeholder="Scan atau ketik kode, lalu Enter" onkeydown="if(event.key==='Enter')lookupCode()"></div><button class="btn primary" onclick="lookupCode()">Cari Barang</button><div id="scanResult" style="margin-top:18px"></div></div></div>`}
function lookupCode(code){code=code||$('scanCode')?.value.trim();let x=itemArr().find(a=>a.code.toLowerCase()===String(code).toLowerCase());if(!x){$('scanResult').innerHTML='<p class="dangertext">Kode barang tidak ditemukan.</p>';return}selectedScan=x.id;$('scanResult').innerHTML=`<b>${esc(x.name)}</b><p class="sub">${esc(x.code)} · Stok ${x.stock} · ${money(x.price)}</p><div class="toolbar"><button class="btn success" onclick="quickStock('${x.id}')">Tambah Stok Masuk</button><button class="btn primary" onclick="quickSell('${x.id}')">Catat Barang Keluar</button></div>`}
function startScanner(){if(!window.Html5Qrcode)return toast('Library scanner belum termuat');if(scanner)return;scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},code=>{stopScanner();$('scanCode').value=code;lookupCode(code)},()=>{}).catch(e=>{scanner=null;toast('Kamera gagal dibuka: '+e)})}
function stopScanner(){if(scanner){scanner.stop().then(()=>scanner.clear()).catch(()=>{}).finally(()=>scanner=null)}}
function quickStock(id){go('stockin');setTimeout(()=>{if($('stockItem'))$('stockItem').value=id},50)}function quickSell(id){go('cashier');setTimeout(()=>addCart(id),50)}
function stockPage(){return `<div class="pagehead"><div><h1>Stok Masuk</h1><div class="sub">Penerimaan barang kulakan dari supplier akan menambah stok otomatis.</div></div></div><div class="twocol"><div class="panel"><h3>Form Penerimaan Barang</h3><div class="field"><label>Barang</label><select id="stockItem">${itemArr().map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)} (stok ${x.stock})</option>`).join('')}</select></div><div class="field"><label>Supplier</label><input id="supplier" placeholder="Nama toko / supplier"></div><div class="formgrid"><div class="field"><label>Jumlah Masuk</label><input id="stockQty" type="number" min="1" value="1"></div><div class="field"><label>Harga Beli per Unit</label><input id="stockCost" type="number" min="0" placeholder="Opsional"></div></div><div class="field"><label>Catatan</label><input id="stockNote" placeholder="Nomor faktur / catatan"></div><label style="font-size:12px"><input type="checkbox" id="stockExpense" checked> Catat pembelian sebagai pengeluaran kas</label><div style="margin-top:15px"><button class="btn primary" onclick="saveStockIn()">Simpan Stok Masuk</button></div></div><div class="panel"><h3>Petunjuk</h3><p class="sub">Stok akan bertambah setelah transaksi berhasil disimpan. Jika opsi pengeluaran dipilih, sistem juga membuat mutasi kas keluar berdasarkan jumlah × harga beli.</p><div class="alert">Pastikan jumlah dan harga beli sesuai faktur supplier.</div></div></div>`}
async function saveStockIn(){let id=$('stockItem').value,q=Number($('stockQty').value),x=items[id];if(!x||q<=0)return toast('Pilih barang dan jumlah yang benar');let cost=Number($('stockCost').value||x.cost||0),total=q*cost,txid=db.ref('transactions').push().key,now=Date.now(),updates={};updates['items/'+id+'/stock']=Number(x.stock||0)+q;updates['transactions/'+txid]={type:'stockin',date:dateKey(),time:now,lines:[{id,code:x.code,name:x.name,qty:q,cost}],total,supplier:$('supplier').value,note:$('stockNote').value};if($('stockExpense').checked){let cid=db.ref('cashflows').push().key;updates['cashflows/'+cid]={type:'out',category:'Belanja Stok',description:`Restock ${x.name} (${q} unit)`,amount:total,date:dateKey(),time:now,source:txid}}await db.ref().update(updates);toast('Stok masuk berhasil dicatat');render()}
function cashierAddForm(){return `<div class="toolbar"><select id="cartSelect" class="search" style="max-width:280px">${itemArr().map(x=>`<option value="${x.id}">${esc(x.name)} · ${money(x.price)} (stok ${x.stock})</option>`).join('')}</select><button class="btn soft" onclick="addSelected()">Tambah Barang</button><button class="btn soft" onclick="go('scan')">Scan QR</button></div>`}
function cashPage(){return `<div class="pagehead"><div><h1>Kasir & Barang Keluar</h1><div class="sub">Satu nota dapat berisi beberapa barang dan jasa servis.</div></div><button class="btn soft" onclick="cart=[];render()">Kosongkan Keranjang</button></div><div class="twocol"><div class="panel"><div class="panelhead"><h3>Daftar Belanja</h3></div>${cashierAddForm()}<div id="cartLines">${cart.map((l,i)=>`<div class="cartline"><span><b>${esc(l.name)}</b><br><small>${money(l.price)} / unit</small></span><input type="number" min="1" value="${l.qty}" onchange="changeQty(${i},this.value)"><b>${money(l.price*l.qty)}</b><button class="btn danger" style="padding:5px" onclick="removeCart(${i})">×</button></div>`).join('')||'<div class="empty">Keranjang masih kosong.</div>'}</div><div class="field" style="margin-top:15px"><label>Jasa servis / ongkos pasang (Rp)</label><input id="serviceFee" type="number" min="0" value="0" oninput="updateCashTotal()"></div><div class="field"><label>Nama pelanggan (opsional)</label><input id="customer" placeholder="Nama pelanggan"></div></div><div class="panel"><h3>Pembayaran</h3><div class="totalbox"><span style="font-size:11px;color:#c7d2e6">TOTAL TAGIHAN</span><strong id="grandTotal">${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</strong></div><div class="field" style="margin-top:16px"><label>Uang diterima (Rp)</label><input id="paid" type="number" min="0" value="0" oninput="updateCashTotal()"></div><div class="alert"><span>Kembalian</span><b id="changeAmount">${money(0)}</b></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="checkout()">Selesaikan & Cetak Nota</button><p class="sub">Stok, pemasukan, HPP, dan laba akan dicatat otomatis saat transaksi diselesaikan.</p></div></div>`}
function addSelected(){addCart($('cartSelect').value)}function addCart(id){let x=items[id];if(!x)return toast('Barang tidak ditemukan');let l=cart.find(a=>a.id===id);if(l){if(l.qty+1>Number(x.stock))return toast('Stok tidak mencukupi');l.qty++}else{if(Number(x.stock)<1)return toast('Stok habis');cart.push({id,name:x.name,code:x.code,price:Number(x.price),cost:Number(x.cost),qty:1})}render()}
function changeQty(i,v){let q=Math.max(1,Number(v));let x=items[cart[i].id];if(q>Number(x.stock)){toast('Melebihi stok tersedia');q=Number(x.stock)}cart[i].qty=q;render()}
function removeCart(i){cart.splice(i,1);render()}function updateCashTotal(){let subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),fee=Number($('serviceFee')?.value||0),total=subtotal+fee,paid=Number($('paid')?.value||0);$('grandTotal').textContent=money(total);$('changeAmount').textContent=money(Math.max(0,paid-total))}
async function checkout(){if(!cart.length)return toast('Keranjang masih kosong');let fee=Number($('serviceFee').value||0),subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),total=subtotal+fee,paid=Number($('paid').value||0);if(paid<total)return toast('Uang diterima belum mencukupi');for(let l of cart){if(Number(items[l.id]?.stock||0)<l.qty)return toast('Stok '+l.name+' tidak mencukupi')}let txid=db.ref('transactions').push().key,now=Date.now(),hpp=cart.reduce((s,x)=>s+x.cost*x.qty,0),updates={};cart.forEach(l=>updates['items/'+l.id+'/stock']=Number(items[l.id].stock)-l.qty);let lines=cart.map(x=>({...x}));updates['transactions/'+txid]={type:'sale',date:dateKey(),time:now,lines,serviceFee:fee,subtotal,total,paid,change:paid-total,hpp,profit:subtotal-hpp+fee,customer:$('customer').value};let cid=db.ref('cashflows').push().key;updates['cashflows/'+cid]={type:'in',category:'Penjualan',description:'Penjualan '+txid,amount:total,date:dateKey(),time:now,source:txid,hpp,profit:subtotal-hpp+fee};await db.ref().update(updates);let sale={id:txid,lines,serviceFee:fee,subtotal,total,paid,change:paid,hpp,profit:subtotal-hpp+fee,customer:$('customer').value,date:dateKey(),time:now};cart=[];render();printReceipt(sale);toast('Transaksi berhasil disimpan')}
function printReceipt(t){$('printArea').innerHTML=`<div class="receipt"><h3>JUNIOR JAYA MOTOR</h3><center>Struk Penjualan</center><hr><div>No: ${t.id}</div><div>Tanggal: ${new Date(t.time).toLocaleString('id-ID')}</div><div>Pelanggan: ${esc(t.customer||'-')}</div><hr>${t.lines.map(x=>`<div>${esc(x.name)}<br>${x.qty} x ${money(x.price)} <span style="float:right">${money(x.qty*x.price)}</span></div>`).join('<br>')}<hr><div>Subtotal <span style="float:right">${money(t.subtotal)}</span></div><div>Jasa servis <span style="float:right">${money(t.serviceFee)}</span></div><b>Total <span style="float:right">${money(t.total)}</span></b><br><div>Bayar <span style="float:right">${money(t.paid)}</span></div><div>Kembali <span style="float:right">${money(t.change)}</span></div><hr><center>Terima kasih telah berbelanja!</center></div>`;$('printArea').classList.remove('hidden');setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},250)}
function financePage(){let period=$('period')?.value||'month',d=new Date(),start=period==='day'?dateKey():period==='year'?`${d.getFullYear()}-01-01`:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,end=period==='day'?dateKey():period==='year'?`${d.getFullYear()}-12-31`:dateKey();let rows=cashArr().filter(x=>x.date>=start&&x.date<=end),ins=rows.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount),0),outs=rows.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount),0),hpp=rows.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.hpp||0),0),profit=rows.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.profit||0),0);let days={};rows.forEach(x=>{let k=x.date.slice(-2);days[k]??={i:0,o:0};days[k][x.type==='in'?'i':'o']+=Number(x.amount)});let chart=Object.entries(days).sort().slice(-14),max=Math.max(1,...chart.flatMap(([k,v])=>[v.i,v.o]));return `<div class="pagehead"><div><h1>Keuangan</h1><div class="sub">Pembukuan kas, HPP, dan laba bengkel.</div></div><button class="btn primary" onclick="cashForm()">+ Catat Mutasi</button></div><div class="panel"><div class="toolbar"><select id="period" class="search" style="max-width:180px" onchange="render()"><option value="day" ${period==='day'?'selected':''}>Harian</option><option value="month" ${period==='month'?'selected':''}>Bulanan</option><option value="year" ${period==='year'?'selected':''}>Tahunan</option></select><span class="sub" style="align-self:center">${start} s/d ${end}</span><button class="btn soft" onclick="exportFinance()">Export Excel</button><button class="btn soft" onclick="exportPDF()">Export PDF</button></div><div class="cards"><div class="stat"><span class="statlabel">Total Pemasukan</span><div class="statnum" style="font-size:19px;color:var(--green)">${money(ins)}</div></div><div class="stat"><span class="statlabel">Total Pengeluaran</span><div class="statnum" style="font-size:19px;color:var(--red)">${money(outs)}</div></div><div class="stat"><span class="statlabel">HPP Barang Terjual</span><div class="statnum" style="font-size:19px">${money(hpp)}</div></div><div class="stat"><span class="statlabel">Laba Bersih Penjualan*</span><div class="statnum" style="font-size:19px;color:var(--green)">${money(profit-outs)}</div></div></div><p class="sub">*Laba penjualan = penjualan dikurangi HPP dan ditambah jasa servis, kemudian dikurangi pengeluaran kas pada periode ini.</p></div><div class="panel"><div class="panelhead"><h3>Grafik Pemasukan vs Pengeluaran</h3><div class="legend"><span><i style="background:#1ba77b"></i>Pemasukan</span><span><i style="background:#e85b68"></i>Pengeluaran</span></div></div><div class="chart">${chart.map(([k,v])=>`<div class="barcol"><div class="barpair"><div class="bar in" style="height:${v.i/max*100}%"></div><div class="bar out" style="height:${v.o/max*100}%"></div></div><span class="barlabel">${k}</span></div>`).join('')||'<span class="sub">Belum ada data pada periode ini.</span>'}</div></div><div class="panel"><div class="panelhead"><h3>Mutasi Kas</h3></div>${cashTable(rows)}</div>`}
function cashTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td><span class="pill ${x.type==='out'?'out':''}">${x.type==='in'?'Pemasukan':'Pengeluaran'}</span></td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada mutasi kas.</td></tr>'}</tbody></table></div>`}
function cashForm(){showModal(`<h3>Catat Mutasi Kas Manual</h3><div class="field"><label>Jenis</label><select id="cashType"><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select></div><div class="field"><label>Kategori</label><select id="cashCat">${['Pemasukan Lain','Jasa Servis','Belanja Stok','Gaji Mekanik','Listrik','Sewa','Operasional','Lainnya'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Keterangan</label><input id="cashDesc"></div><div class="field"><label>Jumlah (Rp)</label><input id="cashAmount" type="number" min="1"></div><div class="field"><label>Tanggal</label><input id="cashDate" type="date" value="${dateKey()}"></div><div class="dialogfoot"><button class="btn soft" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveCash()">Simpan</button></div>`)}
async function saveCash(){let amount=Number($('cashAmount').value);if(amount<=0)return toast('Jumlah harus lebih dari nol');let id=db.ref('cashflows').push().key;await db.ref('cashflows/'+id).set({type:$('cashType').value,category:$('cashCat').value,description:$('cashDesc').value,amount,date:$('cashDate').value,time:Date.now()});closeModal();toast('Mutasi kas tersimpan')}
function exportFinance(){let rows=cashArr().map(x=>({Tanggal:x.date,Jenis:x.type==='in'?'Pemasukan':'Pengeluaran',Kategori:x.category,Keterangan:x.description,Jumlah:x.amount,HPP:x.hpp||0,Laba:x.profit||0}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Pembukuan');XLSX.writeFile(wb,'Pembukuan_Junior_Jaya_Motor.xlsx')}
function exportPDF(){let {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(16);doc.text('JUNIOR JAYA MOTOR - LAPORAN KEUANGAN',14,18);doc.setFontSize(9);let y=28;cashArr().slice(0,35).forEach(x=>{doc.text(`${x.date} | ${x.type==='in'?'Masuk':'Keluar'} | ${x.category} | ${x.description||''} | ${money(x.amount)}`,14,y);y+=6;if(y>280){doc.addPage();y=15}});doc.save('Laporan_Keuangan_JJM.pdf')}
function historyPage(){let rows=txArr();return `<div class="pagehead"><div><h1>Riwayat Transaksi</h1><div class="sub">Riwayat stok masuk dan penjualan.</div></div><input type="date" class="search" style="max-width:160px" id="historyDate" value="${dateKey()}" onchange="filterHistory()"></div><div class="panel"><div id="historyRows">${historyTable(rows)}</div></div>`}
function historyTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Detail</th><th>Supplier / Pelanggan</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.time).toLocaleString('id-ID')}</td><td><span class="pill ${x.type==='sale'?'':'low'}">${x.type==='sale'?'Penjualan':'Stok Masuk'}</span></td><td>${(x.lines||[]).map(l=>`${esc(l.name)} × ${l.qty}`).join(', ')}</td><td>${esc(x.customer||x.supplier||'-')}</td><td>${money(x.total)}</td><td>${x.type==='sale'?`<button class="btn soft" onclick="reprint('${x.id}')">Cetak</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div>`}
function filterHistory(){let d=$('historyDate').value;$('historyRows').innerHTML=historyTable(txArr().filter(x=>x.date===d))}
function reprint(id){let x=txs[id];if(x)printReceipt({...x,id})}
function filterTable(q,id){document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
</script>
</body></html>
